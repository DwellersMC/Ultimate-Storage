plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/ultimate-storage.accesswidener")
}

repositories {
	mavenCentral()
	maven { url = "https://maven.nucleoid.xyz/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation include("eu.pb4:sgui:${project.sgui_version}")
	api "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
	api "com.terraformersmc:modmenu:${project.modmenu_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
	dependsOn "generateItemNames"
}

// The words the game itself gives its items, for every language this mod speaks.
//
// Which languages those are is not listed here but read from the mod's own language files, so shipping
// `ja_jp.json` in `assets/ultimate-storage/lang` is all it takes to have Japanese item names baked too.
// The words themselves have to come from the game: a dedicated server's own files carry English only,
// so a language is taken from the assets Loom has already downloaded, or from the game jar in the Loom
// cache when the assets do not carry it (which is the case for English). Baked into the jar, they let
// item search answer a player in the language their own client draws the items in — the only language
// they can search in.
def itemNamesDir = layout.buildDirectory.dir("generated/ultsItemNames")
def itemNamesNamespace = project.archives_base_name.toString()
def itemNamesGameVersion = project.minecraft_version.toString()
def modLanguagesDir = file("src/main/resources/assets/${itemNamesNamespace}/lang")
// Only the words an item's name can be built from; the rest of a language file is screens, subtitles
// and telemetry, which no item is ever named after.
def itemNamesPrefixes = [
	"item.", "block.", "effect.", "entity.", "enchantment.", "potion.", "painting.", "filled_map.",
	"instrument.", "jukebox_song.", "trim_material.", "trim_pattern.", "upgrade.", "smithing_template."
]
def modLanguages = providers.provider {
	modLanguagesDir.isDirectory() ? modLanguagesDir.listFiles()
		.findAll { it.isFile() && it.name.endsWith(".json") }
		.collect { it.name.substring(0, it.name.length() - ".json".length()) }
		.findAll { it ==~ /[a-z0-9][a-z0-9_-]*/ }
		.sort() : []
}

/** The asset index of this Minecraft version, or null while Loom has not downloaded the assets. */
def gameAssetIndex = {
	File assets = [
		new File(gradle.gradleUserHomeDir, "caches/fabric-loom/assets"),
		new File(System.getProperty("user.home"), ".gradle/caches/fabric-loom/assets"),
		new File(rootDir, ".gradle/loom-cache/assets")
	].find { root ->
		new File(root, "indexes").listFiles()?.any {
			it.name.startsWith(itemNamesGameVersion + "-") && it.name.endsWith(".json")
		}
	}
	List<File> indexes = assets == null ? [] : new File(assets, "indexes").listFiles()?.findAll {
		it.name.startsWith(itemNamesGameVersion + "-") && it.name.endsWith(".json")
	}?.sort { it.name } ?: []
	File index = indexes.isEmpty() ? null : indexes.last()
	return [root: assets, objects: index == null ? null : new groovy.json.JsonSlurper().parse(index).objects]
}

/** The game jars Loom has downloaded, whose own assets carry the languages the index does not. */
def gameJars = {
	File loom = new File(gradle.gradleUserHomeDir, "caches/fabric-loom")
	String version = itemNamesGameVersion
	return [
		new File(loom, "${version}/minecraft-merged.jar"),
		new File(loom, "${version}/minecraft-client.jar"),
		new File(loom, "${version}/minecraft-extracted_server.jar"),
		new File(loom, "minecraftMaven/net/minecraft/minecraft-merged-deobf/${version}/" +
			"minecraft-merged-deobf-${version}.jar")
	].findAll { it.isFile() }
}

def readFromJar = { File jar, String path ->
	def zip = new java.util.zip.ZipFile(jar)
	try {
		def entry = zip.getEntry(path)
		return entry == null ? null : zip.getInputStream(entry).withCloseable { it.getText("UTF-8") }
	} finally {
		zip.close()
	}
}

/** The game's own words for one language, or null while the game has none to offer. */
def gameLanguage = { Map assets, String locale ->
	String path = "minecraft/lang/${locale}.json"
	def entry = assets.objects == null ? null : assets.objects[path]
	if (entry != null && assets.root != null) {
		File file = new File(assets.root, "objects/${entry.hash.substring(0, 2)}/${entry.hash}")
		if (file.isFile()) {
			return new groovy.json.JsonSlurper().parse(file, "UTF-8")
		}
	}
	for (File jar : gameJars()) {
		String text = readFromJar(jar, "assets/${path}")
		if (text != null) {
			return new groovy.json.JsonSlurper().parseText(text)
		}
	}
	return null
}

tasks.register("generateItemNames") {
	group = "build"
	description = "Bakes this version's own item names into the jar, for the languages the mod speaks."
	inputs.property "locales", modLanguages
	inputs.property "minecraftVersion", itemNamesGameVersion
	inputs.property "assetLanguages", providers.provider {
		Map assets = gameAssetIndex()
		modLanguages.get().collect { locale ->
			def entry = assets.objects == null ? null : assets.objects["minecraft/lang/${locale}.json"]
			entry != null && new File(assets.root,
				"objects/${entry.hash.substring(0, 2)}/${entry.hash}").isFile() ? entry.hash : "unavailable"
		}
	}
	outputs.dir itemNamesDir
	doLast {
		List<String> locales = modLanguages.get()
		File output = itemNamesDir.get().asFile
		// Written again from scratch, so a language the mod no longer ships leaves no names behind.
		delete output
		if (locales.isEmpty()) {
			logger.lifecycle("Ults: the mod ships no language file, so no item name is baked.")
			return
		}
		Map assets = gameAssetIndex()
		for (String locale : locales) {
			def language = gameLanguage(assets, locale)
			if (language == null) {
				logger.lifecycle("Ults: the game has no {} names to bake; its items keep the words " +
					"their own mods ship for that language.", locale)
				continue
			}
			def names = new TreeMap<String, String>()
			language.each { key, value ->
				if (value instanceof String && itemNamesPrefixes.any { key.startsWith(it) }) {
					names[key] = value
				}
			}
			File target = new File(output, "assets/${itemNamesNamespace}/itemnames/${locale}.json")
			target.parentFile.mkdirs()
			target.setText(groovy.json.JsonOutput.toJson(names), "UTF-8")
			logger.lifecycle("Ults: baked {} {} name(s) from the game's own language file.",
				names.size(), locale)
		}
	}
}

sourceSets.main.resources.srcDir(itemNamesDir)

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xlint:deprecation"]
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	workingDir = layout.buildDirectory.dir('test-work').get().asFile
	doFirst { workingDir.mkdirs() }
}

tasks.register('acceptanceTest', Test) {
	group = 'verification'
	description = 'Runs headless storage, recovery, crafting and delivery acceptance scenarios.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'acceptance' }
	shouldRunAfter tasks.named('test')
}

tasks.named('check') { dependsOn tasks.named('acceptanceTest') }

// Opt-in native server acceptance. Ordinary runs and the distributable jar never load the probe.
// Usage: gradlew -PserverAcceptance serverAcceptanceTest
if (providers.gradleProperty('serverAcceptance').isPresent()) {
	def acceptanceRoot = layout.buildDirectory.dir('server-acceptance').get().asFile
	def acceptedEula = file('run/eula.txt')
	def serverProbe = sourceSets.create('serverTest') {
		java.setSrcDirs(['src/serverTest/java'])
		resources.setSrcDirs(['src/serverTest/resources'])
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
	loom.mods.register('ults-server-acceptance') { sourceSet serverProbe }
	loom.runs.named('server') {
		source serverProbe
		runDir 'build/server-acceptance'
		vmArg '-Xmx768m'
		programArg 'nogui'
	}
	tasks.named('runServer') {
		dependsOn tasks.named('serverTestClasses')
		doFirst {
			if (internalRunDir.get().asFile.canonicalFile != acceptanceRoot.canonicalFile) {
				throw new GradleException('Server acceptance must run in its isolated build directory')
			}
			acceptanceRoot.mkdirs()
			def eula = new File(acceptanceRoot, 'eula.txt')
			if (!eula.isFile() || !(eula.text =~ /(?m)^eula=true\s*$/).find()) {
				if (!acceptedEula.isFile() || !(acceptedEula.text =~ /(?m)^eula=true\s*$/).find()) {
					throw new GradleException('Native acceptance requires an already accepted run/eula.txt')
				}
				eula.setText(acceptedEula.getText('UTF-8'), 'UTF-8')
			}
			new File(acceptanceRoot, 'server.properties').setText(
				"level-name=world-${UUID.randomUUID()}\nserver-ip=127.0.0.1\nserver-port=0\n" +
				"online-mode=true\npause-when-empty-seconds=0\nview-distance=2\n" +
				"simulation-distance=2\nmax-players=1\nspawn-protection=0\n", 'UTF-8')
			new File(acceptanceRoot, 'server-acceptance-results.txt').setText('RUNNING\n', 'UTF-8')
		}
		doLast {
			def report = new File(acceptanceRoot, 'server-acceptance-results.txt')
			if (!report.isFile() || !report.getText('UTF-8').startsWith('PASS\n')) {
				throw new GradleException('Native server acceptance failed: ' + report)
			}
			logger.lifecycle(report.getText('UTF-8'))
		}
	}
	tasks.register('serverAcceptanceTest') {
		group = 'verification'
		description = 'Tests vanilla recipes, world topology, redstone and actual saved-data writes in an isolated server.'
		dependsOn tasks.named('runServer')
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "LICENSE_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

// The baked names are data, not source, so the sources jar leaves them out — but it does read the
// directory they are written to, so it has to wait for the task that writes it.
tasks.named("sourcesJar") {
	dependsOn "generateItemNames"
	exclude "assets/${project.archives_base_name}/itemnames/**"
}
